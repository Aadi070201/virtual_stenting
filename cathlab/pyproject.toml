[project]
name = "vcathlab"
version = "0.1.0"
description = "Virtual cath lab: simulated coronary angiography with full ground truth. Research use only; not a medical device."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
dicom = ["pydicom>=2.4"]
app = ["streamlit>=1.36", "plotly>=5.22"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
vcathlab = "vcathlab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vcathlab"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: long-running test (deselect with -m \"not slow\")"]
