# Validation against wire FFR (docs/PLAN.md, P4; docs/validation/PROTOCOL.md).
# The analysis must be fixed (and this file committed) before the reference values are opened.
primary_index_test: tree_solver   # single_solver | single_surrogate | tree_solver
ffr_cutoff: 0.80                  # index test and wire FFR: <= cut-off = positive (ischaemic)
ifr_cutoff: 0.89                  # wire iFR: classification only (FFR and iFR differ)
level: 0.95                       # confidence intervals
n_bootstrap: 2000                 # patient-level cluster bootstrap resamples
seed: 0

# Sample-size planning (vstent sample-size → reports/validation_sample_size.md).
# PLACEHOLDERS: to be set with a statistician from published angiography-derived FFR studies
# and the partner site's case mix before the protocol is submitted.
sample_size:
  alpha: 0.05                     # two-sided
  power: 0.80
  prevalence: 0.35                # share of vessels with wire FFR <= 0.80
  expected_sensitivity: 0.85
  expected_specificity: 0.85
  ci_half_width: 0.075            # precision of sensitivity and specificity (+-)
  expected_auc: 0.90
  null_auc: 0.80                  # the AUC must be shown to exceed this
  expected_sd_difference: 0.07    # SD of (index test - wire FFR)
  loa_ci_half_width: 0.03         # precision of each limit of agreement (+-)
  vessels_per_patient: 1.3
  icc: 0.10                       # intra-patient correlation of the endpoint
  non_analysable_fraction: 0.10   # vessels the pipeline cannot analyse
