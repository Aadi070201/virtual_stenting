# Rendered angiograms for segmentation training (docs/PLAN.md, P8 sim-to-real). NOT clinical data.
# `vstent synth-angio` writes data/synth_angio/v1/{train,val,test}.npz + manifest and
# reports/synth_angio_card.md. Ranges are [low, high], sampled uniformly. Sampling choices may be
# tuned (appearance tuned by eye against ARCADE val frames, never test); the label rule and the
# training setup are pre-registered in docs/PLAN.md.
name: synth_angio_v1
out_dir: data/synth_angio/v1
seed: 8001                     # split seeds: train 8001+, val 1008001+, test 2008001+
n: {train: 2000, val: 200, test: 200}
workers: null                  # null = all CPU cores but one

scene:                         # trees, views and imaging chain (configs/two_view_synthetic.yaml)
  tree_config: configs/synth_tree_v1.yaml
  sampling:                    # whole coronary trees rather than one analysed segment
    length_mm: [80.0, 140.0]
    d0_mm: [2.5, 4.0]
    side_count_probs: [0.0, 0.1, 0.2, 0.3, 0.4]
    side_length_mm: [30.0, 80.0]
  heart_radius_mm: [50.0, 65.0]
  heart_offset_sd_mm: 10.0
  primary_deg: [-45.0, 60.0]
  secondary_deg: [-35.0, 40.0]
  iso_pixel_mm: [0.22, 0.30]   # as ARCADE (D39)
  image_size: 512
  mu_per_mm: [0.04, 0.08]
  background: [0.49, 0.64]
  texture_sd: 0.04
  texture_scale_px: 40.0
  blur_px: [0.8, 1.2]
  edge_amount: [2.0, 3.0]
  edge_sigma_px: [1.5, 3.0]
  noise_sd: [0.012, 0.022]

two_trees_prob: 0.6            # a left system: two trees from one ostium
label_min_diameter_mm: 1.5     # pre-registered: label vessels whose reference diameter >= 1.5 mm
small_branches: [12, 30]       # drawn, not labelled
small_diameter_mm: [0.5, 1.3]
small_length_mm: [15.0, 50.0]
catheter_prob: 0.9
catheter_diameter_mm: [1.7, 2.3]
catheter_length_mm: 200.0
shadows: [1, 3]
shadow_amplitude: [0.03, 0.12]
shadow_softness_px: [20.0, 80.0]
ribs: [0, 5]
rib_width_px: [12.0, 30.0]
rib_amplitude: [0.02, 0.06]
vignetting: [0.0, 0.15]
min_inside: 0.6
tries: 200
