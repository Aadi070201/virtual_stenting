# Synthetic stand-in study for the validation tool (docs/PLAN.md, P4). NOT clinical data.
# `vstent validate-synthetic` renders these cases, runs `vstent validate` on them and writes
# reports/validation_synthetic.md. Ranges are [low, high], sampled uniformly. All values are
# sampling choices for a stand-in (they may be tuned); the physics comes from configs/physics.yaml.
name: validation_synthetic
out_dir: data/validation_synthetic
seed: 4001
n_patients: 60
vessels_per_patient_probs: [0.5, 0.3, 0.2]   # P(1), P(2), P(3) vessels per patient
territories: [LAD, LCX, RCA]                 # labels only; geometry does not depend on them
n_points: 256

# vessel trees: the P2 sampler (configs/synth_tree_v1.yaml) with these overrides, so that the
# analysed segment is a typical one (40-80 mm, a sensor where the main vessel is still >~1.5 mm)
sampling:
  length_mm: [40, 80]
  d0_mm: [2.5, 4.0]
  side_count_probs: [0.2, 0.4, 0.3, 0.1, 0.0]   # P(0..4) side branches
  side_diameter_ratio: [0.4, 0.7]
  side_length_mm: [10, 40]

# imaging. Pixel size at the vessel: vessel widths in px then match ARCADE (widest vessel per
# image ~13-20 px). Contrast and processing fitted to ARCADE centreline contrast (DECISIONS D39).
image_size: 512
mm_per_px: [0.22, 0.30]
calibrated_fraction: 0.8         # patients whose pixel size the manifest gives ...
calibration_error_rel: 0.03      # ... with this relative error (SD); the others assume 0.30
click_sd_px: 1.5                 # start / sensor point placement error (SD per axis)
mu_per_mm: [0.04, 0.08]          # attenuation x pixel size = 0.009-0.024 per px of lumen
background: [0.49, 0.64]         # ARCADE background interquartile range
texture_sd: 0.04
texture_scale_px: 40
blur_px: [0.8, 1.2]
edge_amount: [2.0, 3.0]          # unsharp-mask edge enhancement
edge_sigma_px: [1.5, 3.0]
noise_sd: [0.012, 0.022]         # ARCADE high-frequency noise ~0.017

# layout
stub_mm: 6                       # main vessel drawn before the start point
continuation_mm: [5, 15]         # and beyond the sensor
side_angle_deg: [35, 65]
curvature_rad: [0.0, 0.5]
side_curvature_rad: [0.0, 0.3]
wavelength_px: [150, 400]
clearance_px: 3
margin_px: 8
layout_tries: 40
