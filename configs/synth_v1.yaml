# Synthetic vessel dataset v1 (docs/PLAN.md, M2).
# Ranges are [low, high], sampled uniformly unless noted. Units as named (mm, mmHg, %, m/s).
# Sampling distributions may be tuned; physics constants may not (they come from PhysicsParams,
# identical to configs/physics.yaml, and are saved resolved next to the data).
name: v1
out_dir: data/synth/v1
n_points: 256
shard_size: 10000
workers: null                    # null = all CPU cores

sampling:
  length_mm: [30, 80]
  d0_mm: [2.25, 4.5]             # proximal reference diameter
  distal_taper: [0.6, 0.95]      # distal reference diameter = D0 × U(low, high)
  lesion_count_probs: [0.10, 0.55, 0.25, 0.10]   # P(0), P(1), P(2), P(3) lesions
  lesion_ds_pct: [20, 90]
  lesion_ds_beta: [3.0, 3.5]     # Beta(a, b) scaled to lesion_ds_pct; 80% of lesions in 40-80% DS
                                 # (tuned from [2, 2], which gave 14.3% grey zone; DECISIONS D10)
  lesion_length_mm: [3, 25]
  lesion_margin_mm: 5            # minimum distance from both vessel ends
  lesion_gap_mm: 2               # minimum gap between lesions
  shape_probs: {cosine: 0.25, skewed_cosine: 0.25, plateau: 0.25, irregular: 0.25}
  skew_peak: [0.2, 0.8]          # throat position within a skewed lesion (fraction of length)
  plateau_fraction: [0.3, 0.7]   # flat part of a plateau lesion (fraction of length)
  irregular_amplitude: 0.3       # smooth random modulation of irregular / diffuse shapes
  diffuse_prob: 0.2
  diffuse_ds_pct: [0, 20]
  diffuse_length_frac: [0.3, 0.8]   # diffuse segment length / vessel length
  noise_sigma_frac: [0.0, 0.03]  # noise σ as a fraction of r_ref
  noise_corr_mm: 1.0             # Gaussian smoothing length of the noise
  min_radius_frac: 0.5           # noisy radius ≥ this × noise-free radius (keeps r > 0)
  pa_mmhg: [70, 110]
  pv_mmhg: [2, 8]
  v_hyp: [0.25, 0.45]            # m/s, microvascular variability

splits:
  train: {n: 100000, seed: 1001}
  val:   {n: 10000,  seed: 1002}
  test:  {n: 10000,  seed: 1003}
  ood:
    n: 5000
    seed: 1004
    overrides:
      length_mm: [80, 120]
      lesion_count_probs: [0.0, 0.0, 0.0, 0.5, 0.5]   # 3 or 4 lesions
