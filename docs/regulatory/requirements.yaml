# Software requirements (IEC 62304 §5.2), DRAFT for review by a qualified person.
# Research use only: this software is not a medical device and is not for clinical use.
#
# Each requirement names the code that implements it (path or path::name) and how it is
# verified: tests (tests/<file>.py::<test>), generated reports (reports/...), an inspection
# note, or the gap that remains. `vstent regulatory` checks every reference and renders
# REQUIREMENTS.md and TRACEABILITY.md. Hazards (hazards.yaml) list the requirements that are
# their risk controls.

requirements:
  # --- Labelling and information for safety -------------------------------------------------
  - id: SR-01
    title: Research-use notice everywhere
    kind: labelling
    text: >-
      The command-line help, every app screen, the case report (JSON and PNG) and every
      generated report state that the software is for research use only, is not a medical
      device and must not be used for decisions about real patients.
    code:
      - src/vstent/__init__.py::DISCLAIMER
      - src/vstent/app/core.py::BANNER
      - src/vstent/cli.py
    tests:
      - tests/test_cli.py::test_help_shows_disclaimer
      - tests/test_app.py::test_app_synthetic_mode_end_to_end
      - tests/test_app.py::test_overlay_and_report_without_pixels
      - tests/test_reporting.py::test_every_report_states_research_use_only

  - id: SR-02
    title: Plain-language warnings with every result
    kind: labelling
    text: >-
      Every analysis returns plain-language warnings, shown next to the result in the app, the
      CLI and the case report, for: an assumed (uncalibrated) pixel size; more diameters from
      the fallback measurement or capped than the set limits; inputs outside the surrogate's
      training ranges; a surrogate FFR below the physical floor Pv/Pa; a stretch without a
      measurable lumen; a bridged segmentation gap; side paths that were not modelled.
    code:
      - src/vstent/inference/pipeline.py::analyse_vessel
      - src/vstent/inference/pipeline.py::analyse_tree
      - src/vstent/inference/pipeline.py::lumen_warnings
      - src/vstent/inference/pipeline.py::range_warnings
    tests:
      - tests/test_pipeline.py::test_analyse_vessel_solver_and_surrogate
      - tests/test_pipeline.py::test_range_warnings
      - tests/test_app.py::test_app_image_mode_with_example
      - tests/test_lumen_model.py::test_occlusion_and_gap_are_reported_to_the_user
      - tests/test_tree_surrogate.py::test_floor_warnings

  - id: SR-03
    title: Scope of the uncertainty intervals stated
    kind: labelling
    text: >-
      Wherever intervals are shown, the software states what they cover: the model interval
      covers only the surrogate's error against the reduced-order solver, the input interval
      only the listed assumptions; neither covers the reduced-order model's own error.
    code:
      - src/vstent/app/core.py::UNCERTAINTY_NOTE
      - src/vstent/app/core.py::case_report
    reports:
      - reports/uncertainty.md
    inspection: >-
      The app shows UNCERTAINTY_NOTE under the intervals (streamlit_app.py) and the case
      report stores it with them; no test asserts the on-screen text yet.

  # --- Inputs --------------------------------------------------------------------------------
  - id: SR-04
    title: One image loader
    kind: input
    text: >-
      PNG, JPEG and single-frame DICOM images are read by one loader used by the CLI, the app
      and the evaluations; the image is converted to 8-bit greyscale the same way everywhere
      and its SHA-256 is recorded.
    code:
      - src/vstent/imaging/image_io.py::read_image
      - src/vstent/imaging/image_io.py::ImageInput
    tests:
      - tests/test_app.py::test_read_image_png_jpg_dicom
      - tests/test_pipeline.py::test_cli_and_app_give_the_segmenter_the_same_pixels

  - id: SR-05
    title: Cine runs on one intensity scale
    kind: input
    text: >-
      A cine run (multi-frame DICOM or a folder of frames) is read with one intensity scale
      for all frames (frame-wise stretching would distort the opacification) and the frame
      time from FrameTime or CineRate when present.
    code:
      - src/vstent/imaging/image_io.py::read_run
      - src/vstent/imaging/image_io.py::read_run_bytes
      - src/vstent/imaging/image_io.py::RunInput
    tests:
      - tests/test_cine.py::test_read_run_from_a_folder_and_a_dicom

  - id: SR-06
    title: End-diastolic analysis frame in the opacified phase
    kind: input
    text: >-
      For a run, the analysis frame is the end-diastolic frame (SR-44) inside the opacified
      window (frames above 70% of the peak of the smoothed vessel area, counted at probability
      ≥ 0.9) with the most vessel; with no end-diastolic frame there, the most opacified
      frame. The frame and the reason are shown. The user can choose another frame; a frame
      outside the window is warned about.
    code:
      - src/vstent/imaging/cine.py::opacification
      - src/vstent/imaging/cardiac.py::ed_analysis_frame
      - src/vstent/imaging/run_analysis.py::analyse_frames
      - src/vstent/cli.py::_run_frame
    tests:
      - tests/test_cine.py::test_opacification_window_and_frames
      - tests/test_cardiac.py::test_ed_from_spread_finds_the_largest_tree
      - tests/test_pipeline.py::test_cli_analyse_cine_run
    reports:
      - reports/cine_frames.md
      - reports/cine_synthetic.md

  - id: SR-44
    title: End-diastolic frames from the DICOM or the images
    kind: input
    text: >-
      The end-diastolic frames of a run come from the DICOM R-wave pointer, else from the R
      peaks of a DICOM ECG waveform mapped to frames (FrameDelay, FrameTime and the
      waveform's time offset), else from the images (the vessel tree's spread, its beat by
      autocorrelation). The source is shown and stored in the case report (P7).
    code:
      - src/vstent/imaging/cardiac.py::r_wave_pointer
      - src/vstent/imaging/cardiac.py::read_ecg
      - src/vstent/imaging/cardiac.py::r_peaks
      - src/vstent/imaging/cardiac.py::ed_from_spread
      - src/vstent/imaging/cardiac.py::end_diastole
    tests:
      - tests/test_cardiac.py::test_r_peaks_and_frames
      - tests/test_cardiac.py::test_dicom_r_wave_pointer_and_ecg_round_trip
      - tests/test_cardiac.py::test_ed_from_spread_finds_the_largest_tree
    reports:
      - reports/cine_synthetic.md

  - id: SR-45
    title: Heart motion followed through the run
    kind: imaging
    text: >-
      Points on the analysed centreline are followed through the run by affine registration of
      the vessel maps, on the fully opacified frames only; filling and washout frames take the
      transform of the same heart phase (P7, D55).
    code:
      - src/vstent/imaging/motion.py::track_affine_maps
      - src/vstent/imaging/motion.py::plateau
      - src/vstent/imaging/cine.py::contrast_transit
    tests:
      - tests/test_cardiac.py::test_track_affine_follows_scale_and_shift
      - tests/test_cardiac.py::test_transit_with_tracking_ignores_partial_filling
      - tests/test_cardiac.py::test_plateau_and_same_phase_transforms
    reports:
      - reports/cine_synthetic.md

  - id: SR-46
    title: Measured flow velocity with guards, phase correction and interval
    kind: uncertainty
    text: >-
      The contrast flow velocity is the slope of distance on flow time (phasic correction
      from the end-diastolic frames). It is accepted only with a forward-moving front, a
      frame time, a calibrated pixel size, a known heart cycle, 0.05–0.80 m/s and a precise
      slope. Its 90% interval is calibrated on separate synthetic cases (one view: widened
      for foreshortening); two runs are combined only when they agree within ×1.5. A resting
      run is converted with the FAVOR Pilot relation, and the interval enters the input
      Monte Carlo when the velocity is used (P7).
    code:
      - src/vstent/imaging/flow.py::flow_velocity
      - src/vstent/imaging/flow.py::flow_time
      - src/vstent/imaging/flow.py::combine_runs
      - src/vstent/imaging/flow.py::hyperemic_velocity
      - src/vstent/uncertainty/inputs.py::InputUncertainty
    tests:
      - tests/test_cardiac.py::test_flow_velocity_conversion_and_guards
      - tests/test_cardiac.py::test_flow_time_and_phasic_slope
      - tests/test_uncertainty.py::test_monte_carlo_ranges_and_reproducibility
    reports:
      - reports/cine_synthetic.md
      - reports/cine_calibration.md

  - id: SR-47
    title: Multi-frame consensus for cine runs
    kind: imaging
    text: >-
      For a cine run the vessel is measured on up to five end-diastolic frames on which the
      contrast has filled the analysed path, before the washout, with the user's points
      following the heart. The median distal FFR is reported with every frame's value; the
      frame closest to the median gives the profile for intervals and plans; a frame whose
      path length differs by more than 30% is left out with the reason; the result is flagged
      when the frames fall on both sides of 0.80. vstent analyse, the app and vstent validate
      use the same function (P4g).
    code:
      - src/vstent/inference/consensus.py::run_consensus
      - src/vstent/inference/consensus.py::consensus_frames
      - src/vstent/inference/consensus.py::Consensus
      - src/vstent/imaging/cine.py::contrast_transit
      - src/vstent/validation/run.py::predict_case
    tests:
      - tests/test_consensus.py::test_run_consensus_follows_the_heart
      - tests/test_consensus.py::test_consensus_median_choice_and_flag
      - tests/test_consensus.py::test_consensus_frames_on_the_fully_opacified_path
      - tests/test_consensus.py::test_validate_reports_the_consensus_on_a_run
      - tests/test_cardiac.py::test_cli_analyse_beating_heart_run_with_measured_flow
    reports:
      - reports/consensus.md

  # --- Segmentation and QCA ------------------------------------------------------------------
  - id: SR-07
    title: Segmentation in ONNX Runtime with the training pre-processing
    kind: imaging
    text: >-
      The vessel segmentation runs in ONNX Runtime with the same pre-processing function as in
      training; the exported model agrees with the trained one to < 1e-4 in probability; a
      model file that is not a segmentation model is refused.
    code:
      - src/vstent/inference/onnx_runtime.py::SegmentationRunner
      - src/vstent/imaging/segment.py::preprocess_image
    tests:
      - tests/test_pipeline.py::test_export_seg_parity_and_runner
      - tests/test_pipeline.py::test_runner_rejects_non_segmentation_model
      - tests/test_segmentation.py::test_preprocess_image_any_size_and_dtype
    reports:
      - reports/seg_onnx.md
      - reports/seg_eval.md
      - reports/seg_synth/seg_onnx.md
      - reports/seg_synth/seg_eval.md
      - reports/sim_to_real.md

  - id: SR-08
    title: Points off the vessel refused
    kind: imaging
    text: >-
      A start or end point that is not on (or within the snapping tolerance of) the segmented
      vessel is refused with a message; no analysis is produced from it.
    code:
      - src/vstent/imaging/centerline.py::snap_point
      - src/vstent/imaging/qca_tree.py::tree_qca
    tests:
      - tests/test_qca.py::test_points_off_the_vessel_are_refused
      - tests/test_qca_tree.py::test_tree_qca_refuses_points_off_the_vessel

  - id: SR-09
    title: Pixel size and units
    kind: imaging
    text: >-
      Diameters and lengths are in SI units. The pixel size comes from the user or the DICOM
      pixel spacing; otherwise a default is assumed and flagged (SR-02). Unit conversions
      happen only at input and output, with 1 mmHg = 133.322 Pa.
    code:
      - src/vstent/units.py
      - src/vstent/imaging/qca.py::run_qca
      - src/vstent/imaging/qca.py::DEFAULT_MM_PER_PX
    tests:
      - tests/test_qca.py::test_qca_units_and_calibration_flag
      - tests/test_units.py::test_unit_conversions
      - tests/test_physics_report.py::test_physics_yaml_matches_spec_defaults

  - id: SR-10
    title: Lumen edges from the image intensity
    kind: imaging
    text: >-
      For an automatic segmentation the lumen edges come from the angiogram's intensity,
      guided by the segmentation: one continuous contour per side, the guide's diameter at
      side-branch openings, crossing vessels capped at 1.15 × the reference rather than read
      as a narrowing.
    code:
      - src/vstent/imaging/qca.py::measure_diameters_intensity
      - src/vstent/imaging/qca.py::track_edge
      - src/vstent/inference/pipeline.py::AUTO_LUMEN
    tests:
      - tests/test_pipeline.py::test_automatic_segmentation_uses_intensity_edges
      - tests/test_qca.py::test_edge_tracking_follows_one_contour
      - tests/test_qca.py::test_side_branch_does_not_inflate_diameter
      - tests/test_qca.py::test_crossing_vessel_is_capped_not_a_stenosis
      - tests/test_public_validation.py::test_intensity_edges_recover_a_stenosis_the_segmentation_filled
      - tests/test_public_validation.py::test_intensity_edges_off_centre_and_eccentric_lumen

  - id: SR-11
    title: QCA accuracy on rendered vessels
    kind: imaging
    text: >-
      On synthetic rendered tubes: median absolute diameter error ≤ 0.7 px, MLD location
      error ≤ 3 px, diameter-stenosis error within ±7 points (M5 targets).
    code:
      - src/vstent/imaging/qca.py::qca_from_centerline
      - src/vstent/imaging/qca_validation.py
    tests:
      - tests/test_qca.py::test_qca_on_synthetic_stenosis_meets_targets
    reports:
      - reports/qca_synthetic.md

  - id: SR-43
    title: Absolute lumen size
    kind: imaging
    text: >-
      For an automatic segmentation the lumen's shape (%DS) comes from the intensity edges and
      its absolute size from the imaging chain fitted on healthy stretches of the vessel: one
      factor per vessel, which side branches inherit. A failed fit or an implausible factor
      keeps the edges' size and shows a warning.
    code:
      - src/vstent/imaging/qca.py::size_factor_from_image
      - src/vstent/imaging/qca.py::healthy_windows
      - src/vstent/imaging/lumen_model.py::fit_windows
      - src/vstent/imaging/qca_tree.py::tree_qca
      - src/vstent/inference/pipeline.py::AUTO_LUMEN
      - src/vstent/inference/pipeline.py::lumen_warnings
    tests:
      - tests/test_lumen_model.py::test_scaled_lumen_recovers_the_size_and_keeps_the_shape
      - tests/test_lumen_model.py::test_healthy_windows_and_refused_factor
      - tests/test_pipeline.py::test_automatic_segmentation_uses_intensity_edges
    reports:
      - reports/two_view_synthetic.md
    inspection: >-
      Verified on rendered vessels only (held-out renders, D50: median size error 0.0%, 97% of
      views within ±15%; intensity edges alone −13%). On real ARCADE frames only consistency
      with the renders was checked (factor accepted on 18 of 20 frames, median 1.15); no
      absolute size ground truth exists for real angiograms.

  - id: SR-12
    title: Segmentation gaps and unmeasurable lumens
    kind: imaging
    text: >-
      A gap in the segmentation between aligned vessel ends is bridged and measured from the
      image (never interpolated). A stretch without a measurable lumen is reported as
      "critical stenosis or total occlusion" with the warning that the FFR is not valid if
      the vessel is occluded.
    code:
      - src/vstent/imaging/centerline.py::bridge_gaps
      - src/vstent/imaging/qca.py::recentre_gaps
      - src/vstent/inference/pipeline.py::lumen_warnings
    tests:
      - tests/test_lumen_model.py::test_a_gap_in_the_mask_is_bridged_and_measured_from_the_image
      - tests/test_lumen_model.py::test_gap_bridging_needs_aligned_nearby_ends
      - tests/test_lumen_model.py::test_occlusion_and_gap_are_reported_to_the_user
    inspection: >-
      Verified on rendered vessels only. On real angiograms the occlusion warning did not fire
      (CADICA, hazard H-04).

  - id: SR-13
    title: Analysed path shown on the image
    kind: imaging
    text: >-
      The centreline that was analysed is drawn on the angiogram (app overlay and analysis
      figure), so the user can see which vessel and which path were measured.
    code:
      - src/vstent/app/core.py::overlay_image
      - src/vstent/inference/figures.py
    tests:
      - tests/test_app.py::test_overlay_and_report_without_pixels
      - tests/test_pipeline.py::test_cli_analyse_end_to_end

  # --- Physics -------------------------------------------------------------------------------
  - id: SR-14
    title: Reduced-order FFR model
    kind: physics
    text: >-
      FFR is computed from ΔP(Q) = a·Q + b·Q² (Poiseuille viscous loss and the expansion loss
      Kt·ρ/2·(1/A_min − 1/A_max)², Kt = 1.52) with the closed-form flow root; FFR starts at 1
      and never increases along the vessel; the M1 sanity bands hold.
    code:
      - src/vstent/physics/solver.py::solve_ffr
      - src/vstent/physics/solver.py::viscous_coefficient
      - src/vstent/physics/solver.py::expansion_coefficient
    tests:
      - tests/test_physics.py::test_uniform_tube_poiseuille_fixed_flow
      - tests/test_physics.py::test_sudden_expansion_matches_borda_carnot
      - tests/test_physics.py::test_ffr_starts_at_one_and_never_increases
      - tests/test_physics.py::test_sanity_bands_3mm_60mm_10mm_cosine
      - tests/test_physics.py::test_distal_ffr_strictly_decreases_with_stenosis
      - tests/test_physics.py::test_grid_convergence
    reports:
      - reports/physics_checks.md

  - id: SR-15
    title: Microvascular resistance calibration
    kind: physics
    text: >-
      R_micro is calibrated so that the stenosis-free reference vessel carries the hyperemic
      reference velocity; after a virtual stent R_micro is kept fixed, so the flow rises.
    code:
      - src/vstent/physics/solver.py::calibrate_microvascular_resistance
    tests:
      - tests/test_physics.py::test_reference_vessel_carries_reference_flow
      - tests/test_planning.py::test_solver_fixed_r_micro_matches_calibration_and_flow_rises_after_stent
      - tests/test_app.py::test_presets_and_fixed_r_micro_after_stent

  - id: SR-16
    title: Vessel-tree physics
    kind: physics
    text: >-
      Trees with side branches conserve mass at every junction, split the healthy flow by
      Murray's law and reduce exactly to the single-vessel model for one branch.
    code:
      - src/vstent/physics/tree.py::solve_tree
      - src/vstent/physics/tree.py::murray_flows
    tests:
      - tests/test_tree.py::test_single_branch_reproduces_m1_exactly
      - tests/test_tree.py::test_mass_conservation_pressure_continuity_and_outlets
      - tests/test_tree.py::test_healthy_tree_splits_flow_by_murrays_law
      - tests/test_tree.py::test_side_branch_raises_distal_main_ffr
    reports:
      - reports/tree_physics.md

  - id: SR-17
    title: Invalid geometry refused
    kind: physics
    text: >-
      Profiles with non-positive radii, non-increasing positions or mismatched lengths, and
      physically invalid parameters, are refused with an error instead of producing an FFR.
    code:
      - src/vstent/physics/geometry.py::VesselProfile
      - src/vstent/physics/tree.py::VesselTree
    tests:
      - tests/test_geometry.py::test_profile_validation
      - tests/test_physics.py::test_invalid_inputs_rejected
      - tests/test_tree.py::test_tree_validation

  # --- Surrogate model -------------------------------------------------------------------------
  - id: SR-18
    title: Surrogate parity and shared pre-processing
    kind: surrogate
    text: >-
      The surrogate runs in ONNX Runtime with the training pre-processing; ONNX and the
      trained model agree to < 1e-4; normalisation statistics that do not match the model are
      refused.
    code:
      - src/vstent/inference/onnx_runtime.py::SurrogateRunner
      - src/vstent/surrogate/features.py::prepare_inputs
    tests:
      - tests/test_onnx.py::test_parity_with_torch
      - tests/test_onnx.py::test_runner_on_profile_matches_torch
      - tests/test_onnx.py::test_runner_rejects_mismatched_stats
      - tests/test_onnx.py::test_parallel_preprocessing_is_identical
    reports:
      - reports/onnx_benchmark.md

  - id: SR-19
    title: Physically shaped surrogate output
    kind: surrogate
    text: >-
      The surrogate's FFR curve starts at 1 and never increases along the vessel (monotone
      head), for single vessels and trees.
    code:
      - src/vstent/surrogate/model.py
      - src/vstent/surrogate/tree_model.py
    tests:
      - tests/test_surrogate.py::test_head_monotone_and_starts_at_one
      - tests/test_tree_surrogate.py::test_tree_head_is_continuous_and_monotone

  - id: SR-20
    title: Surrogate accuracy against the solver
    kind: surrogate
    text: >-
      On held-out synthetic vessels the surrogate's distal-FFR MAE against the reduced-order
      solver is ≤ 0.015 and its agreement at 0.80 ≥ 97%.
    code:
      - src/vstent/surrogate/evaluate.py
    tests:
      - tests/test_surrogate.py::test_train_and_evaluate_smoke
    reports:
      - reports/surrogate_eval.md
      - reports/uncertainty.md

  - id: SR-21
    title: The solver is the reference
    kind: surrogate
    text: >-
      Every analysis reports the reduced-order solver's FFR next to the surrogate's; the
      planner re-checks surrogate-ranked plans with the solver before showing them.
    code:
      - src/vstent/inference/pipeline.py::analyse_vessel
      - src/vstent/planning/optimizer.py::plan_stents
      - src/vstent/planning/tree_planner.py::plan_tree_stents
    tests:
      - tests/test_pipeline.py::test_analyse_vessel_solver_and_surrogate
      - tests/test_planning.py::test_surrogate_backend_runs_and_is_rechecked
      - tests/test_tree_planner.py::test_surrogate_backend_with_solver_check

  # --- Uncertainty and grey zone ---------------------------------------------------------------
  - id: SR-22
    title: Model interval (split-conformal)
    kind: uncertainty
    text: >-
      A 90% split-conformal interval for distal FFR, calibrated on a split used for nothing
      else; coverage on the test split 88–92%.
    code:
      - src/vstent/uncertainty/conformal.py::fit_conformal
      - src/vstent/uncertainty/greyzone.py::model_interval
    tests:
      - tests/test_uncertainty.py::test_conformal_coverage_on_exchangeable_data
      - tests/test_uncertainty.py::test_conformal_interval_capped_and_roundtrip
    reports:
      - reports/uncertainty.md

  - id: SR-23
    title: Input interval (Monte Carlo)
    kind: uncertainty
    text: >-
      A 90% interval for distal FFR from Monte Carlo draws through the solver over the pixel
      size (when assumed), the hyperemic velocity, Pa / Pv and the QCA diameter error.
    code:
      - src/vstent/uncertainty/inputs.py::InputUncertainty
      - src/vstent/uncertainty/inputs.py::QCAErrorModel
    tests:
      - tests/test_uncertainty.py::test_monte_carlo_ranges_and_reproducibility
      - tests/test_uncertainty.py::test_qca_error_model_from_report
      - tests/test_uncertainty.py::test_post_pci_draws_use_the_plan_geometry

  - id: SR-24
    title: Grey-zone flag
    kind: uncertainty
    text: >-
      A case is flagged when an interval contains 0.80 (pre-PCI), a plan when it contains the
      planner's target (post-PCI); the flag and its reason are shown in the app, the CLI and
      the case report.
    code:
      - src/vstent/uncertainty/greyzone.py::assessment
      - src/vstent/uncertainty/greyzone.py::Assessment
      - src/vstent/uncertainty/greyzone.py::plan_assessments
    tests:
      - tests/test_uncertainty.py::test_assessment_flags
      - tests/test_app.py::test_app_shows_intervals_and_grey_zone
      - tests/test_app.py::test_core_intervals_flags_and_report

  # --- Virtual stent and planner ---------------------------------------------------------------
  - id: SR-25
    title: A virtual stent only widens
    kind: planning
    text: >-
      A virtual stent sets r(s) = max(r(s), r_stent) over its segment and never narrows a
      lumen.
    code:
      - src/vstent/planning/stent.py::apply_stents
      - src/vstent/planning/stent.py::stented_radius
    tests:
      - tests/test_planning.py::test_stent_widens_inside_and_never_narrows
      - tests/test_planning.py::test_stent_never_reduces_a_wider_lumen

  - id: SR-26
    title: Generic catalogue and sizing rule
    kind: planning
    text: >-
      Plans use only the generic catalogue (nominal diameters and lengths, no products); a
      planned stent's diameter is ≤ max_diameter_ratio × the reference diameter at its distal
      end; a manual stent above that limit is flagged.
    code:
      - configs/stent_catalog.yaml
      - src/vstent/planning/optimizer.py::StentCatalog
      - src/vstent/planning/optimizer.py::feasible
      - src/vstent/app/core.py::stent_warnings
    tests:
      - tests/test_planning.py::test_candidates_cover_an_mld_on_the_step_grid
      - tests/test_planning.py::test_focal_lesion_shortest_plan_reaching_target
      - tests/test_app.py::test_oversized_manual_stent_is_flagged
    inspection: >-
      StentCatalog accepts only diameters_mm and lengths_mm (StrictModel: other keys are
      refused), so a product name cannot enter the catalogue.

  - id: SR-27
    title: Shortest plan reaching the target
    kind: planning
    text: >-
      The planner returns the shortest total stent length that brings distal FFR to the
      target, and says so when there is no lesion or the target cannot be reached.
    code:
      - src/vstent/planning/optimizer.py::plan_stents
    tests:
      - tests/test_planning.py::test_focal_lesion_shortest_plan_reaching_target
      - tests/test_planning.py::test_two_stent_plan_is_shortest_with_exhaustive_pools
      - tests/test_planning.py::test_no_lesion_and_unreachable_target
      - tests/test_tree_planner.py::test_no_lesion_no_plan
    reports:
      - reports/planner_benchmark.md

  - id: SR-28
    title: Plans belong to the analysed vessel
    kind: planning
    text: >-
      Plans and stents shown always belong to the current geometry and pressures; analysing
      another vessel resets the stent controls.
    code:
      - src/vstent/app/streamlit_app.py
      - src/vstent/app/core.py::CaseState
    tests:
      - tests/test_app.py::test_plans_and_stents_belong_to_one_geometry_and_pressure
      - tests/test_app.py::test_new_vessel_resets_stent_controls

  # --- User interface and performance ----------------------------------------------------------
  - id: SR-29
    title: Interactive stent updates
    kind: interface
    text: >-
      Moving a stent control updates the post-PCI FFR in < 300 ms server time.
    code:
      - src/vstent/app/core.py::stent_update
    tests:
      - tests/test_app.py::test_slider_update_is_fast
      - tests/test_app.py::test_app_synthetic_mode_end_to_end
    reports:
      - reports/app_latency.md

  - id: SR-30
    title: Planner speed
    kind: interface
    text: >-
      Planning over 5,000 candidate stents takes < 1 s (surrogate backend, median).
    code:
      - src/vstent/planning/optimizer.py::plan_stents
    tests:
      - tests/test_planning.py::test_solver_backend_throughput_5000_candidates
    reports:
      - reports/planner_benchmark.md

  - id: SR-31
    title: Measured flow velocity is shown, and used only when the user chooses it
    kind: interface
    text: >-
      The contrast flow velocity of a run is shown with its interval, its source (rest:
      FAVOR Pilot conversion; hyperemic run: as measured) and the reasons when a guard fails.
      The fixed hyperemic velocity stays the default; the measured one replaces it only when
      the user chooses it (CLI --flow measured, the app's toggle) and every guard passed, and
      the case report records which velocity was used (P7).
    code:
      - src/vstent/imaging/cine.py::contrast_transit
      - src/vstent/imaging/flow.py::flow_velocity
      - src/vstent/app/core.py::flow_caption
      - src/vstent/app/core.py::flow_dict
    tests:
      - tests/test_cine.py::test_contrast_transit_recovers_the_front_speed
      - tests/test_app.py::test_cine_and_flow_captions
      - tests/test_cardiac.py::test_cli_analyse_beating_heart_run_with_measured_flow
    inspection: >-
      vstent analyse and the app compute the analysis with the configured velocity unless the
      user selects the measured one; the alternative FFR is printed alongside.

  - id: SR-48
    title: Guided cine workflow
    kind: interface
    text: >-
      The default app guides one cine run in six steps: load; choose an end-diastolic frame
      (recommended one marked, any frame selectable); an automatic path along the main vessel
      the user can replace with two clicks, with narrowings of 50% or more numbered; the
      multi-frame virtual FFR with a plain-language reading, its likely range and whether the
      heartbeats agreed; a suggested stent with the FFR before and after, adjustable by hand
      (only lengths that fit the path); and the report. Every screen carries the research-use
      notice.
    code:
      - src/vstent/app/guided.py::frame_choices
      - src/vstent/app/guided.py::auto_path
      - src/vstent/app/guided.py::lesion_marks
      - src/vstent/app/guided.py::verdict
      - src/vstent/app/guided.py::stability
      - src/vstent/imaging/centerline.py::main_trunk_endpoints
    tests:
      - tests/test_guided.py::test_guided_app_whole_flow
      - tests/test_guided.py::test_plain_language_helpers
      - tests/test_guided.py::test_main_trunk_takes_the_wider_branch_and_stops
    reports: []

  - id: SR-32
    title: Robust console output
    kind: interface
    text: >-
      The CLI never fails on a console that cannot print its characters (legacy code pages).
    code:
      - src/vstent/cli.py
    tests:
      - tests/test_cli.py::test_console_output_never_crashes_on_legacy_code_page

  # --- Data protection, integrity and reproducibility ------------------------------------------
  - id: SR-33
    title: Patient data never in the repository
    kind: data
    text: >-
      The validation tool refuses to read case data from, or write outputs to, tracked
      locations of the repository.
    code:
      - src/vstent/validation/manifest.py::check_local_only
    tests:
      - tests/test_validation.py::test_local_only_guard
      - tests/test_validation.py::test_run_refuses_tracked_output

  - id: SR-34
    title: App local by default
    kind: data
    text: >-
      The app serves on localhost unless another address is given explicitly, with
      Streamlit's usage statistics switched off; the analysis makes no network calls.
    code:
      - src/vstent/cli.py::launch_app
    tests:
      - tests/test_app.py::test_cli_app_launches_streamlit_on_localhost
    inspection: >-
      Only the dataset commands (vstent data ...) download; the analysis path has no network
      code. There is no user login or access control: the app relies on the computer's.

  - id: SR-35
    title: Verified downloads and safe extraction
    kind: data
    text: >-
      Downloaded datasets are checked against a published checksum before use (a mismatch
      leaves no files) and archive extraction refuses paths outside the target folder.
    code:
      - src/vstent/data/arcade.py::fetch_arcade
      - src/vstent/data/arcade.py::safe_extract
      - src/vstent/data/cadica.py::fetch_cadica
    tests:
      - tests/test_arcade.py::test_fetch_downloads_verifies_and_extracts
      - tests/test_arcade.py::test_checksum_mismatch_leaves_no_files
      - tests/test_arcade.py::test_safe_extract_rejects_path_traversal
      - tests/test_public_validation.py::test_cadica_boxes_and_fetch

  - id: SR-36
    title: Traceable case report
    kind: data
    text: >-
      The case report holds no image pixels and records the input's SHA-256, the models'
      SHA-256, the software version and commit, the assumptions and the warnings.
    code:
      - src/vstent/app/core.py::case_report
    tests:
      - tests/test_app.py::test_overlay_and_report_without_pixels

  - id: SR-37
    title: Locked predictions
    kind: data
    text: >-
      In a validation study the predictions are locked (SHA-256) before the reference values
      are opened, and any change is detected before scoring.
    code:
      - src/vstent/validation/run.py::run_predictions
      - src/vstent/validation/run.py::score_predictions
    tests:
      - tests/test_validation.py::test_locked_predictions_detect_changes
      - tests/test_validation.py::test_scoring_flow_and_intention_to_diagnose

  - id: SR-38
    title: Strict configuration and provenance
    kind: data
    text: >-
      Configuration files with unknown keys are refused; every trained model and generated
      report is saved with its configuration, the git commit and file hashes.
    code:
      - src/vstent/config.py::StrictModel
      - src/vstent/config.py::save_run_metadata
    tests:
      - tests/test_config.py::test_unknown_key_rejected
      - tests/test_config.py::test_save_run_metadata_roundtrip
      - tests/test_onnx.py::test_export_writes_model_dir_with_provenance
      - tests/test_reporting.py::test_mvp_provenance_has_creation_times

  - id: SR-39
    title: Declared and listed third-party software
    kind: data
    text: >-
      Every third-party module the code imports is a declared dependency with an entry in the
      SOUP list; the SOUP list and the SBOM are generated from uv.lock.
    code:
      - src/vstent/regulatory/soup.py::check_soup
    tests:
      - tests/test_regulatory.py::test_every_imported_module_is_declared_soup
      - tests/test_regulatory.py::test_committed_documents_are_up_to_date

  # --- Known gaps (requirements without an implementation yet) --------------------------------
  - id: SR-40
    title: Pixel size from the projection geometry
    kind: imaging
    text: >-
      For DICOM input the pixel size is corrected for geometric magnification:
      ImagerPixelSpacing × SOD / SID at the isocentre (or ÷ the
      EstimatedRadiographicMagnificationFactor). The detector spacing without magnification
      information is not used as a calibration. With two views, each diameter is scaled with
      the pixel size at its reconstructed 3D point.
    code:
      - src/vstent/imaging/projection.py::read_projection
      - src/vstent/imaging/projection.py::ProjectionGeometry.pixel_size_at
      - src/vstent/imaging/image_io.py::read_image
      - src/vstent/imaging/twoview.py::two_view_profile
    tests:
      - tests/test_twoview.py::test_read_projection_from_dicom_tags
      - tests/test_twoview.py::test_loader_corrects_the_magnification
      - tests/test_twoview.py::test_rays_invert_the_projection_and_pixel_size_follows_depth
      - tests/test_twoview.py::test_two_view_profile_uses_the_magnification_at_the_3d_point
      - tests/test_app.py::test_read_image_png_jpg_dicom
    reports:
      - reports/two_view_synthetic.md
    inspection: >-
      Verified on synthetic geometry only. A single view's isocentre pixel size is exact only
      at the isocentre's depth (4% median error at the vessel in the synthetic cases) and is
      not yet varied in the input intervals.

  - id: SR-41
    title: Foreshortening-free lengths
    kind: imaging
    text: >-
      With two views of a vessel (DICOM geometry, the same two landmarks in each), the vessel
      is reconstructed in 3D and its lumen profile, lengths and FFR follow the 3D centreline.
      Motion of the heart between the runs is estimated and removed (across the epipolar
      lines). The reconstruction is checked: the views' separation, the mean gap between
      paired rays and the reprojection residual give a warning when the geometry does not
      fit, and the figure shows the 3D centreline projected back onto both views. The
      length's sensitivity to smoother fitting is reported with the result. Stent plans from a
      single view state that their lengths are foreshortened.
    code:
      - src/vstent/imaging/twoview.py::reconstruct
      - src/vstent/imaging/twoview.py::estimate_shift
      - src/vstent/imaging/twoview.py::Reconstruction.warnings
      - src/vstent/imaging/twoview.py::Reconstruction.reliable
      - src/vstent/inference/pipeline.py::analyse_two_views
      - src/vstent/inference/figures.py::plot_two_view_analysis
      - src/vstent/app/core.py::two_view_overlay
      - src/vstent/app/core.py::epipolar_guide
      - src/vstent/cli.py::SINGLE_VIEW_LENGTHS
    tests:
      - tests/test_twoview.py::test_reconstruction_recovers_a_projected_curve
      - tests/test_twoview.py::test_motion_between_runs_is_corrected
      - tests/test_twoview.py::test_smoothing_sensitivity_is_reported_not_warned
      - tests/test_twoview.py::test_analyse_two_views_on_a_synthetic_case
      - tests/test_twoview.py::test_cli_two_views
      - tests/test_app.py::test_app_two_view_example
      - tests/test_app.py::test_two_view_overlay_and_report_fields
      - tests/test_pipeline.py::test_cli_analyse_with_plan
    reports:
      - reports/two_view_synthetic.md
    inspection: >-
      Verified on synthetic two-view pairs only (the renderer shares the projection model).
      In the CLI and the app (P5c); the angle convention (D49) is to be confirmed on real
      two-view DICOM.

  - id: SR-42
    title: Usability engineering
    kind: interface
    text: >-
      The user interface is designed and validated with intended users under IEC 62366-1
      (use specification, hazard-related use scenarios, formative and summative evaluation).
    code:
      - src/vstent/app/streamlit_app.py
    gap: >-
      Not started: needs interventional cardiologists as test users.
