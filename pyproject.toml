[project]
name = "vstent"
version = "0.1.0"
description = "Virtual stenting planner: research prototype. Not a medical device; not for clinical use."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "networkx>=3.3",
    "torch>=2.4",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
imaging = [
    "segmentation-models-pytorch>=0.3",
    "torchvision>=0.19",  # listed directly so it comes from the same CUDA index as torch
    "scikit-image>=0.24",
    "opencv-python-headless>=4.10",
    "pycocotools>=2.0.8",
    "pydicom>=2.4",
]
app = [
    "streamlit>=1.36",
    "plotly>=5.22",
    "streamlit-image-coordinates>=0.1.9",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
vstent = "vstent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vstent"]

# --- uv: CUDA 12.6 PyTorch wheels on Windows/Linux (see docs/DECISIONS.md) ---
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# --- ruff ---
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "NPY"]

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running test (deselect with -m \"not slow\")",
]
